name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm

      - name: Install
        run: npm ci

      - name: Build (workspaces)
        run: npm run build

      - name: Typecheck + lint + format:check + test + validate content
        run: npm run ci

      # Blocking. All three packages (core / react / vue) meet their
      # 80/80/80/75 thresholds; a regression here fails the build.
      - name: Coverage
        run: npm run test:coverage

      - name: Upload coverage artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-lcov
          path: |
            packages/*/coverage/lcov.info
          if-no-files-found: ignore
          retention-days: 14
