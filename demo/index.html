<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Training SDK · Demo</title>
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/shepherd.js@14.0.0/dist/css/shepherd.css"
    />
    <style>
      * { box-sizing: border-box; }
      body {
        margin: 0;
        font: 14px/1.5 system-ui, -apple-system, sans-serif;
        color: #0f172a;
        background: #f8fafc;
      }
      .app {
        display: grid;
        grid-template-columns: 240px 1fr;
        grid-template-rows: 56px 1fr;
        height: 100vh;
      }
      .header {
        grid-column: 1 / 3;
        background: #ffffff;
        border-bottom: 1px solid #e2e8f0;
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 0 24px;
      }
      .header .brand { font-weight: 600; }
      .header .avatar {
        width: 32px; height: 32px; border-radius: 50%;
        background: #4f46e5; color: white;
        display: grid; place-items: center;
        cursor: pointer;
      }
      .sidebar {
        background: #ffffff;
        border-right: 1px solid #e2e8f0;
        padding: 16px 12px;
        display: flex;
        flex-direction: column;
        gap: 4px;
      }
      .nav-item {
        display: block;
        padding: 8px 12px;
        border-radius: 6px;
        color: #334155;
        text-decoration: none;
        cursor: pointer;
      }
      .nav-item:hover { background: #f1f5f9; }
      .nav-item.active { background: #eef2ff; color: #4f46e5; font-weight: 500; }
      .workspace {
        padding: 32px;
        overflow: auto;
      }
      .workspace h1 { margin: 0 0 8px 0; font-size: 22px; }
      .workspace p { color: #64748b; }
      .create-btn {
        margin-top: 24px;
        padding: 10px 16px;
        background: #4f46e5;
        color: white;
        border: 0;
        border-radius: 8px;
        font-weight: 500;
        cursor: pointer;
      }
      .controls {
        position: fixed;
        bottom: 24px;
        right: 24px;
        background: white;
        border: 1px solid #e2e8f0;
        border-radius: 12px;
        padding: 12px;
        box-shadow: 0 10px 25px rgba(15,23,42,0.08);
        display: flex;
        flex-direction: column;
        gap: 8px;
      }
      .controls button {
        padding: 8px 12px;
        border: 1px solid #e2e8f0;
        border-radius: 6px;
        background: white;
        cursor: pointer;
        text-align: left;
      }
      .controls button:hover { background: #f8fafc; }
      /* Themeable Shepherd styling — see src/theme/default.ts */
      .training-btn-primary {
        background: var(--in-app-training-primary, #4f46e5);
        color: white;
        border: 0;
        padding: 8px 14px;
        border-radius: 6px;
        font-weight: 500;
        cursor: pointer;
      }
      .training-btn-secondary {
        background: transparent;
        color: #475569;
        border: 1px solid #e2e8f0;
        padding: 8px 14px;
        border-radius: 6px;
        cursor: pointer;
        margin-right: 8px;
      }
    </style>
  </head>
  <body data-tour="app-root">
    <div class="app">
      <div class="header">
        <div class="brand">the example app · Demo</div>
        <div class="avatar" data-tour="header-user-menu-trigger">AP</div>
      </div>
      <nav class="sidebar">
        <a class="nav-item active" data-tour="sidebar-projects-link">Projects</a>
        <a class="nav-item" data-tour="sidebar-workflows-link">Workflows</a>
        <a class="nav-item">Models</a>
        <a class="nav-item">Datasets</a>
        <a class="nav-item">Settings</a>
      </nav>
      <main class="workspace" data-tour="main-workspace">
        <h1>Projects</h1>
        <p>Everything you build starts as a project.</p>
        <button class="create-btn" data-tour="create-project-button">+ New project</button>
      </main>
    </div>

    <div class="controls">
      <strong style="font-size:12px;color:#64748b;margin-bottom:4px;">Training SDK demo</strong>
      <button id="start-onboarding">Start onboarding tour</button>
      <button id="start-workflow">Start workflow tour</button>
      <button id="clear-progress">Reset progress</button>
    </div>

    <script type="module" src="./main.ts"></script>
  </body>
</html>
